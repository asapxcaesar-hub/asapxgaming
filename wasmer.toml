[package]
name = "asaspxgaming/asaspxgaming"
version = "0.1.0"
description = "ASAPxGaming — Nederlandse game reviews en nieuws (Vite static site)"

[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
"/public" = "dist"
"/settings" = "settings"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["-w", "/settings/config.toml"]
